services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: finresolve-demo:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FINRESOLVE_DB_PATH: /data/finresolve.db
      FINRESOLVE_DEMO_ENABLED: "true"
      FINRESOLVE_DEMO_SAMPLE_PATH: /app/data/cfpb/sample.csv
      FINRESOLVE_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SERVER_ADDRESS: 0.0.0.0
    volumes:
      - type: volume
        source: finresolve-data
        target: /data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/api/health
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: runtime
      args:
        FINRESOLVE_API_ORIGIN: http://api:8080
    image: finresolve-frontend-demo:local
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FINRESOLVE_API_ORIGIN: http://api:8080
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  finresolve-data:
