spring:
  application:
    name: finresolve-backend
  datasource:
    url: jdbc:sqlite:${FINRESOLVE_DB_PATH:data/finresolve.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      minimum-idle: 1
      maximum-pool-size: 1
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: true

finresolve:
  db:
    path: ${FINRESOLVE_DB_PATH:data/finresolve.db}
  cors:
    allowed-origins: ${FINRESOLVE_CORS_ORIGINS:http://localhost:3000}

server:
  address: 127.0.0.1
  port: 8080
  tomcat:
    max-http-form-post-size: 21MB
    max-swallow-size: 21MB
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false
